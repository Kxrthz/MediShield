services:
  - type: web
    name: medishield
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: PHARMACIST_PASSWORD
        generateValue: true
      - key: AI_API_KEY
        sync: false
      - key: AI_API_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
      - key: AI_MODEL
        value: gemini-3.8-flash
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        value: sqlite:////opt/render/project/src/instance/medishield.db

# SQLite uses the service filesystem by default. For durable data, attach a paid Render disk
# mounted at /opt/render/project/src/instance and keep DATABASE_URL on that path.
# Free Render instances have ephemeral storage; use managed Postgres for production data.
